name: Build fork image

# Build + push ghcr.io/<owner>/immich-server (backend + static web) from
# the `fork` branch = upstream main + the fork-patches/ patches.
#   - on every push to `fork` (including `sync/<tag>` PR merges)
#   - on manual dispatch
# Never rebuilds immich-machine-learning: this fork does not modify it,
# keep pulling ghcr.io/immich-app/immich-machine-learning.
#
# Image tags, always plus `:latest` and `:fork`:
#   - `sync/<tag>` PR merge (see fork-sync-pr.yml): `:<tag>-fork`, and the
#     `<tag>-fork` git tag + matching GitHub release are created.
#   - any other push: `:<latest-fork-release>-<UTC YYYYMMDDHHMM>`
#     e.g. v3.2.0-rc.1-fork-202608291325

on:
  push:
    branches: [fork]
  workflow_dispatch: {}

concurrency:
  group: fork-image-build
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/immich-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tags
        id: meta
        run: |
          git fetch --tags --force --quiet origin || true

          # sync/<tag> PR merge? -> release build, image tagged with the release version
          UP=$(git log -1 --format='%s %b' HEAD \
                | grep -oE 'sync/v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?' \
                | head -1 | cut -d/ -f2 || true)
          IS_RELEASE=false
          if [ -n "$UP" ] && ! git rev-parse -q --verify "refs/tags/${UP}-fork" >/dev/null; then
            IS_RELEASE=true
          fi

          if [ "$IS_RELEASE" = true ]; then
            VERSION="${UP}-fork"
          else
            # non-release build: <latest fork release>-<UTC YYYYMMDDHHMM>
            LAST_RELEASE=$(git describe --tags --match '*-fork' --abbrev=0 2>/dev/null || echo v0.0.0-fork)
            VERSION="${LAST_RELEASE}-$(date -u +%Y%m%d%H%M)"
          fi

          TAGS=$(printf '%s\n' \
            "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:fork" \
            "${IMAGE_NAME}:${VERSION}")

          {
            echo "is_release=$IS_RELEASE"
            echo "upstream_version=$UP"
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immich-server (fork)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.IMAGE_NAME }}:latest
            BUILD_SOURCE_REF=fork
            BUILD_SOURCE_COMMIT=${{ github.sha }}

      - name: Tag + release (sync/<tag> PR merge)
        if: steps.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UP: ${{ steps.meta.outputs.upstream_version }}
        run: |
          git tag -a "${UP}-fork" -m "Fork of immich-app/immich ${UP} + patches" || true
          git push origin "${UP}-fork" || true
          gh release create "${UP}-fork" \
            --title "${UP}-fork" \
            --notes "Fork of **immich-app/immich ${UP}** + the \`fork-patches/series\` patches.

          Image: \`${IMAGE_NAME}:${UP}-fork\` (also \`:latest\`)." \
            || echo "release ${UP}-fork already exists"

      - name: Re-assert disabled workflows
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in auto-close.yml build-mobile.yml cli.yml close-duplicates.yml \
            docker.yml docs-build.yml docs-deploy.yml docs-destroy.yml fdroid.yml \
            fix-format.yml merge-translations.yml org-pr-require-conventional-commit.yml \
            org-zizmor.yml pr-label-validation.yml pr-labeler.yml prepare-release.yml \
            preview-label.yaml sdk.yml weblate-lock.yml cache-cleanup.yml ; do
              gh workflow disable "$wf" --repo "${{ github.repository }}" 2>/dev/null || true
          done

      - name: Summary
        run: |
          {
            echo "### Image pushed :whale:"
            echo ""
            echo "\`${IMAGE_NAME}:${{ steps.meta.outputs.version }}\` (also \`:latest\`, \`:fork\`)"
            echo ""
            if [ "${{ steps.meta.outputs.is_release }}" = "true" ]; then
              echo "Release build for upstream \`${{ steps.meta.outputs.upstream_version }}\`."
            else
              echo "Non-release build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
